<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务看板</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-7Pl13ft7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-ejlXSaMb.css">
  </head>
  <body>
    <script>
      // 在 CSS 应用前同步主题，避免首屏白闪
      // 注意：Arco 2.x 暗色靠 body[arco-theme='dark'] 属性，不是 class
      try {
        var t = localStorage.getItem('taskcli-theme');
        if (
          t === 'dark' ||
          (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.body.setAttribute('arco-theme', 'dark');
        } else {
          document.body.setAttribute('arco-theme', 'light');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
  </body>
</html>
