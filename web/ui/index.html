<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskToAgent · 任务看板</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* Arco 的颜色变量定义在 body 上，这里给画布兜底背景与文字色，
         避免深色模式下透明区域透出浏览器白色画布 */
      body {
        background: var(--color-bg-1);
        color: var(--color-text-1);
      }
      /* 让原生滚动条 / 表单控件 / 画布底色跟随主题 */
      html[arco-theme='dark'] {
        color-scheme: dark;
      }
      html[arco-theme='light'] {
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <script>
      // 在 CSS 应用前同步主题，避免首屏白闪
      // 注意：Arco 2.x 暗色靠 body[arco-theme='dark'] 属性，不是 class
      try {
        // 旧 key taskcli-theme 兼容一次（2026-10-03 改名 TaskToAgent）
        var t = localStorage.getItem('t2a-theme') || localStorage.getItem('taskcli-theme');
        var theme =
          t === 'dark' ||
          (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
        document.body.setAttribute('arco-theme', theme);
        document.documentElement.setAttribute('arco-theme', theme);
      } catch (e) {}

      // 语言同理：React 挂载前先定好 <html lang> 与标题，
      // 否则英文用户会先看到一帧中文标题再被改写。
      try {
        var savedLang = localStorage.getItem('t2a-lang');
        var lang =
          savedLang === 'zh' || savedLang === 'en'
            ? savedLang
            : /^zh/i.test(navigator.language || '')
              ? 'zh'
              : 'en';
        document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
        document.title =
          lang === 'zh' ? 'TaskToAgent · 任务看板' : 'TaskToAgent · Task Board';
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
